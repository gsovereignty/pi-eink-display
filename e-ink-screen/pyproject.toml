[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hink-diagnostics"
version = "0.1.0"
description = "Bounded diagnostics for the dual-controller HINK-E042A03-A1"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
pi = ["lgpio>=0.2.2", "spidev>=3.6"]

[project.scripts]
hink-diag = "hink_diag.cli:main"

[tool.setuptools.packages.find]
include = ["hink_diag*"]
