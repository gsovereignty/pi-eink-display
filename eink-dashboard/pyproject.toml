[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eink-dashboard"
version = "0.2.0"
description = "Standalone Raspberry Pi system dashboard for dual-controller HINK e-paper"
requires-python = ">=3.11"
dependencies = ["eink-driver==0.1.0", "Pillow>=10,<13"]

[project.scripts]
eink-dashboard = "epaper_dashboard.app:main"
eink-bitcoin = "epaper_dashboard.bitcoin:main"

[tool.setuptools.packages.find]
include = ["epaper_dashboard*"]
