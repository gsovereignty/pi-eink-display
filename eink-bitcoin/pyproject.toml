[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eink-bitcoin"
version = "0.1.0"
description = "Independent Bitcoin mainnet dashboard for Raspberry Pi e-paper"
requires-python = ">=3.11"
dependencies = ["eink-driver==0.1.0", "Pillow>=10,<13"]

[project.scripts]
eink-bitcoin = "bitcoin_eink.app:main"

[tool.setuptools.packages.find]
include = ["bitcoin_eink*"]
