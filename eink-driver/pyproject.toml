[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eink-driver"
version = "0.1.0"
description = "Exact dual-controller HINK-E042A03-A1 driver and Pi 5 wiring diagnostics"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
pi = ["lgpio>=0.2.2", "spidev>=3.6"]

[project.scripts]
eink-driver = "eink_driver.cli:main"

[tool.setuptools.packages.find]
include = ["eink_driver*"]

[tool.setuptools.package-data]
eink_driver = ["upstream/*"]
